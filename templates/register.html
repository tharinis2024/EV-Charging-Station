{% extends 'base.html' %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="auth-head">
            <div class="feature-icon">&#9889;</div>
            <h2>Create account</h2>
            <p class="text-muted">Join EV ChargePoint in a few seconds</p>
        </div>
        <form id="register-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" class="form-control register-name" placeholder="Full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control register-email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" class="form-control register-phone" placeholder="Phone number" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control register-password" placeholder="Choose a password" required>
            </div>
            <button type="submit" id="btn-register" name="register-button" class="btn btn-primary btn-block register-button">Register</button>
        </form>
        <p class="auth-alt">Already have an account? <a href="/login">Login</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value
    };

    fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(res => res.json().then(data => ({status: res.status, body: data})))
    .then(res => {
        if (res.status === 201) {
            showToast('Registration successful! Please login.', 'success');
            setTimeout(() => { window.location.href = '/login'; }, 1000);
        } else {
            showToast(res.body.error || 'Registration failed', 'error');
        }
    })
    .catch(() => showToast('Network error. Please try again.', 'error'));
});
</script>
{% endblock %}
